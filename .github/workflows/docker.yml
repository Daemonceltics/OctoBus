name: docker

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/docker.yml
      - docker/**
      - cmd/**
      - internal/**
      - scripts/build-octobus.sh
      - go.mod
      - go.sum
  push:
    branches:
      - main
    tags:
      - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME || 'docker.io/chaitin/octobus' }}
  REGISTRY: docker.io

jobs:
  build-and-push:
    # Draft PRs are skipped; ready_for_review re-runs the workflow.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set build metadata
        id: metadata
        run: |
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        # arm64 emulation is only needed when publishing a multi-arch image.
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERIO_USERNAME }}
          password: ${{ secrets.DOCKERIO_PASSWORD }}

      - name: Build
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          # PR validation builds the native architecture only; the multi-arch
          # image is produced on main/tags where QEMU is available.
          platforms: linux/amd64
          build-args: |
            OCTOBUS_VERSION=${{ github.ref_name }}
            OCTOBUS_COMMIT=${{ steps.metadata.outputs.commit }}
            OCTOBUS_BUILD_DATE=${{ steps.metadata.outputs.date }}
          cache-from: type=gha

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            OCTOBUS_VERSION=${{ github.ref_name }}
            OCTOBUS_COMMIT=${{ steps.metadata.outputs.commit }}
            OCTOBUS_BUILD_DATE=${{ steps.metadata.outputs.date }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
