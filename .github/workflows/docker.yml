name: docker

on:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME || 'docker.io/chaitin/octobus' }}
  REGISTRY: docker.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set build metadata
        id: metadata
        run: |
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-compile binaries
        env:
          OCTOBUS_VERSION: ${{ github.ref_name }}
          OCTOBUS_COMMIT: ${{ steps.metadata.outputs.commit }}
          OCTOBUS_BUILD_DATE: ${{ steps.metadata.outputs.date }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch bash ./scripts/build-octobus.sh "dist/octobus-linux-$arch"
            # file(1) reads the ELF header, so the static-link check works for
            # both architectures; host ldd cannot execute a foreign-arch
            # interpreter and would pass any cross-compiled binary vacuously.
            if file "dist/octobus-linux-$arch" | grep -q "statically linked"; then
              continue
            fi
            echo "::error::dist/octobus-linux-$arch is dynamically linked; expected a static binary"
            file "dist/octobus-linux-$arch"
            exit 1
          done

      - name: Set up QEMU
        # The runtime layer still executes arm64 apt/user-management steps;
        # only the Go toolchain is cross-compiled natively above.
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Login to Docker Hub
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERIO_USERNAME }}
          password: ${{ secrets.DOCKERIO_PASSWORD }}

      - name: Build
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha

      - name: Build and push
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
